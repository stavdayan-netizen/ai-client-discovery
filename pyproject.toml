[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long prose strings that make up the human-readable Eval report.
"evals/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
