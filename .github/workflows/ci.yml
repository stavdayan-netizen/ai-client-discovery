name: CI

# Lint and unit/integration tests on every Pull Request.
# No secrets, no paid services, no live AI calls (see practice.md section 5).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: python -m pytest

      # Offline and deterministic: regenerates the simulated baseline and re-scores every stored
      # run, failing if a committed report no longer matches. No model, no API calls and no keys.
      - name: Simulated Evals (reproducibility check)
        run: python -m evals.run_evals check
